name: Rate-limit smoke test

# Short check before a full run: brings every panel up once (1 CPU) with the same compose files the
# weekly run uses, puts the authenticated endpoints under the same 32-connection load for a few
# seconds, and fails if any response is a 429 or any authenticated request is not 2xx/3xx.
# Results are uploaded as an artifact only; nothing is published.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v5
        with:
          version: 11
          run_install: false
      - name: Install oha
        run: |
          sudo curl -fsSL -o /usr/local/bin/oha \
            https://github.com/hatoo/oha/releases/latest/download/oha-linux-amd64
          sudo chmod +x /usr/local/bin/oha
      - run: pnpm install --frozen-lockfile
      - name: Short load on every panel
        run: pnpm run bench panel:all --cpus 1 --duration 5 --warmup 1 --output-dir smoke
      - name: Check status codes
        run: |
          fail=0
          for f in smoke/*.json; do
            jq -r '.target as $t | .variants[].results[]
              | "\($t)\t\(.scenario.name)\t\(.statusCounts | tojson)\t\(.ratelimited)\t\(.failed)\t\(.errored)"' "$f"
          done | tee summary.tsv
          while IFS=$'\t' read -r target name codes rl failed errored; do
            if [ "$rl" != "0" ] || [ "$failed" != "0" ]; then
              echo "::error::$target $name: $rl rate-limited, $failed failed ($codes)"; fail=1
            fi
          done < summary.tsv
          n=$(ls smoke/*.json | wc -l)
          if [ "$n" -ne 4 ]; then echo "::error::expected 4 panel reports, got $n"; fail=1; fi
          exit $fail
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke
          path: smoke/

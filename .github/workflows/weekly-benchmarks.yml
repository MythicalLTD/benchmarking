name: Weekly benchmarks

# Runs the whole suite once a week on GitHub-hosted runners and publishes the results to the
# `results` branch of this repository:
#   latest/benchmarks.json         every target of the newest run, with runner specs
#   latest/<kind>-<name>.json      the raw suite report per target
#   history/<YYYY-MM-DD>/...       the same files, kept per run
#   index.json                     list of history entries
# The FeatherPanel website reads latest/benchmarks.json at build time, so no cross-repo token
# is needed here.

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      targets:
        description: "Space separated targets to run (empty = all)"
        required: false
        default: ""

concurrency:
  group: weekly-benchmarks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - id: targets
        env:
          REQUESTED: ${{ github.event.inputs.targets }}
        run: |
          all="panel:featherpanel panel:pterodactyl panel:pelican panel:calagopus panel:hydrodactyl daemon:featherwings daemon:pterodactyl daemon:pelican daemon:calagopus"
          list="${REQUESTED:-$all}"
          echo "targets=$(printf '%s\n' $list | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  bench:
    name: ${{ matrix.target }}
    needs: plan
    # One fresh runner per target keeps each job well inside the 6h limit and the ~14 GB disk:
    # a daemon's fixtures are ~3.7 GB, and `all` on one machine would hold every set at once.
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          docker system prune -af --volumes >/dev/null || true
          df -h /

      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11
          run_install: false

      - name: Install oha
        run: |
          sudo curl -fsSL -o /usr/local/bin/oha \
            https://github.com/hatoo/oha/releases/latest/download/oha-linux-amd64
          sudo chmod +x /usr/local/bin/oha
          oha --version
          docker compose version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmark
        id: run
        env:
          TARGET: ${{ matrix.target }}
        run: pnpm run bench "$TARGET" --output-dir results --prune

      - name: Record runner info
        if: always()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p results
          ci/runner-info.sh "$TARGET" "results/runner-${TARGET/:/-}.json"
          cat "results/runner-${TARGET/:/-}.json"

      - name: Artifact name
        if: always()
        id: name
        env:
          TARGET: ${{ matrix.target }}
        run: echo "name=bench-${TARGET/:/-}" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: results/
          retention-days: 90

  publish:
    name: Publish results
    needs: bench
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          path: artifacts

      - name: Combine
        run: node ci/combine.mjs artifacts benchmarks.json

      - name: Push to the results branch
        run: |
          set -euo pipefail
          day="$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin results >/dev/null; then
            git fetch origin results
            git worktree add out origin/results
            cd out && git checkout -B results
          else
            git worktree add --detach out
            cd out && git checkout --orphan results && git rm -rfq .
          fi
          rm -rf latest "history/$day"
          mkdir -p latest "history/$day"
          cp ../benchmarks.json latest/benchmarks.json
          find ../artifacts -name '*.json' ! -name 'runner-*' -exec cp {} latest/ \;
          cp latest/*.json "history/$day/"
          ls history | sort -r | jq -R . | jq -s '{history: .}' > index.json
          cat > README.md <<'MD'
          # Benchmark results

          Published by the `Weekly benchmarks` workflow on `main`. Do not edit by hand.

          - `latest/benchmarks.json`: newest run, every target plus the runner it ran on
          - `history/<date>/`: previous runs
          MD
          git add -A
          git commit -qm "results: $day (run ${GITHUB_RUN_ID})" || { echo "nothing to commit"; exit 0; }
          git push origin results
